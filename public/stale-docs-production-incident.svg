<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A stale doc reaches a human who catches it and an agent who executes it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="120" rx="520" ry="300" fill="url(#glow)"/>

  <g font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" text-anchor="middle">

    <!-- the source: one stale doc -->
    <rect x="56" y="258" width="234" height="104" rx="12" fill="#1d1d1f"/>
    <text x="173" y="304" font-size="24" font-weight="700" fill="#ffffff">Stale doc</text>
    <text x="173" y="334" font-size="17" fill="#86868b">last touched 2023</text>

    <!-- branch -->
    <path d="M290 310 H344 V212 H396" fill="none" stroke="#86868b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M290 310 H344 V440 H396" fill="none" stroke="#0071e3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- human path -->
    <rect x="396" y="172" width="404" height="80" rx="12" fill="#1d1d1f" opacity="0.55"/>
    <text x="598" y="220" font-size="22" font-weight="600" fill="#ffffff">Human: &#8220;this smells old&#8221;</text>
    <path d="M816 212 H900" fill="none" stroke="#86868b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="930" cy="212" r="12" fill="#86868b"/>
    <text x="1030" y="205" font-size="19" font-weight="600" fill="#1d1d1f">Routed around</text>
    <text x="1030" y="231" font-size="17" fill="#86868b">ten minutes lost</text>

    <!-- agent path -->
    <rect x="396" y="400" width="404" height="80" rx="12" fill="#0071e3"/>
    <text x="598" y="448" font-size="22" font-weight="600" fill="#ffffff">Agent: reads it literally</text>
    <path d="M816 440 H900" fill="none" stroke="#0071e3" stroke-width="6" stroke-linecap="round"/>
    <circle cx="930" cy="440" r="12" fill="#0071e3"/>
    <text x="1030" y="433" font-size="19" font-weight="600" fill="#0071e3">Shipped</text>
    <text x="1030" y="459" font-size="17" fill="#86868b">nothing errors</text>
  </g>

  <g font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="552" font-size="30" font-weight="600" fill="#1d1d1f">Docs are runtime input now</text>
    <text x="600" y="586" font-size="17" fill="#86868b">The staleness detector was human. Agents don&#8217;t have one.</text>
  </g>
</svg>
