<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From river to token — Divy&rsquo;s</title>
<meta name="description" content="An interactive plate: how water, electricity and fibre become the next token of an answer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#fbf8f1; --paper-deep:#f4efe4; --paper-sink:#ece5d6;
  --ink:#17140f; --ink-soft:#3d372e; --muted:#7a7264;
  --rule:#ded5c4; --rule-mid:#c8bda6; --rule-strong:#2a251d;
  --accent:#9a3016; --highlight:#f6e7c9;

  --c-water:#2d6a8e; --c-heat:#c2622f; --c-power:#9c7a14; --c-data:#5b4b8a; --c-token:#3d6b4a;
  --t-water:rgba(45,106,142,.09); --t-heat:rgba(194,98,47,.09); --t-data:rgba(91,75,138,.09); --t-token:rgba(61,107,74,.09);
  --hatch:rgba(23,20,15,.30); --glass:rgba(251,248,241,.94);

  --serif-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --serif-body:"Newsreader","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14120e; --paper-deep:#1b1813; --paper-sink:#23201a;
    --ink:#f0eade; --ink-soft:#d6cdbd; --muted:#9c9385;
    --rule:#342e25; --rule-mid:#4a4234; --rule-strong:#efe8da;
    --accent:#e8825f; --highlight:#3a2f1c;
    --c-water:#6fb8dc; --c-heat:#e08a58; --c-power:#d5b356; --c-data:#a99ae0; --c-token:#7fbf8e;
    --t-water:rgba(111,184,220,.07); --t-heat:rgba(224,138,88,.07); --t-data:rgba(169,154,224,.09); --t-token:rgba(127,191,142,.09);
    --hatch:rgba(240,234,222,.26); --glass:rgba(20,18,14,.94);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--serif-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ---------------------------------------------------------------- canvas */
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#scene.dragging{cursor:grabbing}
#scene text{user-select:none;pointer-events:none}
.fig-num{font-family:var(--serif-display);font-size:64px;font-weight:300;fill:var(--rule-mid);font-variation-settings:"SOFT" 0,"WONK" 1}
.fig-ttl{font-family:var(--serif-display);font-size:38px;font-weight:600;fill:var(--ink);letter-spacing:-.02em;font-variation-settings:"SOFT" 0,"WONK" 1}
.fig-sub{font-family:var(--serif-body);font-size:19px;font-style:italic;fill:var(--muted)}
.fig-kick{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.24em;fill:var(--muted)}
.lbl{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.1em;fill:var(--ink)}
.lbl-s{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.08em;fill:var(--muted)}
.lbl-xs{font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.06em;fill:var(--muted)}
.note{font-family:var(--serif-body);font-size:14px;font-style:italic;fill:var(--muted)}
.note-s{font-family:var(--serif-body);font-size:12px;font-style:italic;fill:var(--muted)}
.hot{cursor:pointer}
.hot:hover .hit{fill:var(--highlight);fill-opacity:.5}

.led{animation:blink 1.8s ease-in-out infinite}
.led.fast{animation-duration:.8s}
@keyframes blink{0%,100%{opacity:.9}50%{opacity:.1}}
.shimmer{animation:shimmer 3.4s linear infinite}
@keyframes shimmer{0%{opacity:.2}50%{opacity:.95}100%{opacity:.2}}
.cell{animation:cell 2.6s ease-in-out infinite}
@keyframes cell{0%,100%{opacity:.12}50%{opacity:.8}}
.bar{transform-box:fill-box;transform-origin:bottom;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.barw{transform-box:fill-box;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#hilite{animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-32}}
.rm *{animation:none!important;transition:none!important}

/* ---------------------------------------------------------------- chrome */
.rule-top{position:fixed;left:0;right:0;top:0;height:4px;background:var(--rule-strong);z-index:8}
header{position:fixed;top:4px;left:0;right:0;height:58px;padding:0 22px;display:flex;align-items:center;gap:22px;
  background:var(--glass);border-bottom:1px solid var(--rule);z-index:8;backdrop-filter:blur(3px)}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand a{font-family:var(--serif-display);font-weight:600;font-size:22px;letter-spacing:-.03em;color:var(--ink);text-decoration:none;
  font-variation-settings:"SOFT" 0,"WONK" 1;white-space:nowrap}
.brand a:hover{color:var(--accent)}
.brand .kick{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.mono-btn{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);background:none;border:1px solid var(--rule);padding:7px 11px;cursor:pointer;line-height:1}
.mono-btn:hover{border-color:var(--rule-strong);color:var(--accent)}
.mono-btn:disabled{opacity:.35;cursor:default}
.mono-btn:disabled:hover{border-color:var(--rule);color:var(--ink-soft)}
.mono-btn[aria-pressed="true"]{border-color:var(--rule-strong);color:var(--accent)}
.mono-btn:focus-visible,#promptbar input:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.zoomlvl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);min-width:46px;text-align:right}
.divider{width:1px;height:20px;background:var(--rule);margin:0 4px}

/* -------------------------------------------------------- figure index */
#rail{position:fixed;left:0;top:62px;bottom:0;width:212px;padding:26px 20px 0;border-right:1px solid var(--rule);
  background:var(--glass);z-index:7;backdrop-filter:blur(3px)}
#rail h2{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;
  color:var(--muted);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
#rail button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:11px 0 10px;cursor:pointer;color:var(--ink-soft);font:inherit}
#rail button:last-of-type{border-bottom:0}
#rail .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);display:block;margin-bottom:3px}
#rail .t{font-family:var(--serif-display);font-size:17px;font-weight:500;letter-spacing:-.01em;display:block;line-height:1.2}
#rail button:hover .t,#rail button.on .t{color:var(--accent)}
#rail button.on .n{color:var(--accent)}
#rail .foot{position:absolute;left:20px;right:20px;bottom:18px;font-family:var(--mono);font-size:9px;line-height:1.7;
  letter-spacing:.08em;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px}
#rail .foot b{font-weight:500;color:var(--ink-soft)}

/* ------------------------------------------------------------ info card */
#info{position:fixed;right:22px;top:82px;width:322px;max-height:calc(100vh - 250px);overflow:auto;z-index:9;
  background:var(--paper);border:1px solid var(--rule-mid);border-top:3px solid var(--rule-strong);padding:16px 18px 16px}
#info[hidden]{display:none}
#info .tag{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:7px;color:var(--muted)}
#info .tag i{width:9px;height:9px;display:inline-block}
#info h3{font-family:var(--serif-display);font-size:22px;font-weight:600;letter-spacing:-.02em;margin:8px 0 2px;line-height:1.15;
  font-variation-settings:"SOFT" 0,"WONK" 1}
#info .role{font-family:var(--serif-body);font-style:italic;font-size:15px;color:var(--accent);margin:0 0 10px}
#info .desc{font-size:15px;line-height:1.6;color:var(--ink-soft);margin:0 0 12px}
#info ul{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--rule)}
#info li{font-family:var(--mono);font-size:10.5px;line-height:1.7;letter-spacing:.02em;color:var(--muted);padding-left:14px;position:relative;margin-bottom:5px}
#info li::before{content:"—";position:absolute;left:0;color:var(--rule-mid)}
#info .close{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:15px;cursor:pointer;line-height:1;padding:4px}
#info .close:hover{color:var(--accent)}
#info .pin{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);margin:10px 0 0;text-transform:uppercase}

/* -------------------------------------------------------------- caption */
#caption{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;width:min(700px,calc(100vw - 280px));z-index:9;
  background:var(--paper);border:1px solid var(--rule-mid);border-top:3px solid var(--rule-strong);padding:14px 18px 12px}
#caption[hidden]{display:none}
#caption .step{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
#caption p{margin:0 0 12px;font-size:16px;line-height:1.55;color:var(--ink-soft)}
#caption .btns{display:flex;align-items:center;gap:6px;border-top:1px solid var(--rule);padding-top:10px}
#caption .dots{margin-left:auto;display:flex;gap:5px;align-items:center}
#caption .dots i{width:14px;height:2px;background:var(--rule-mid);display:block}
#caption .dots i.on{background:var(--accent)}

/* ----------------------------------------------------------- prompt bar */
#promptbar{position:fixed;left:212px;right:0;bottom:0;height:76px;padding:0 22px;display:flex;align-items:center;gap:16px;
  background:var(--glass);border-top:1px solid var(--rule);z-index:8;backdrop-filter:blur(3px)}
#promptbar .lab{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
#promptbar .field{flex:1;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule-mid);padding-bottom:5px;min-width:0}
#promptbar .quote{font-family:var(--serif-display);font-size:24px;color:var(--rule-mid);line-height:0;position:relative;top:6px}
#promptbar input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font-family:var(--serif-body);font-size:20px;font-style:italic;padding:0}
#promptbar input::placeholder{color:var(--rule-mid)}
#promptbar .out{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);white-space:nowrap;text-align:right;line-height:1.6}
#promptbar .out b{color:var(--c-token);font-weight:500}
#promptbar .btn-run{border-color:var(--rule-strong);color:var(--accent)}

/* --------------------------------------------------------------- legend */
#legend{position:fixed;left:234px;bottom:88px;z-index:7;display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  background:var(--glass);border:1px solid var(--rule);padding:7px 12px}
#legend span{display:flex;align-items:center;gap:6px}
#legend i{width:12px;height:3px;display:block}
#hint{position:fixed;right:22px;bottom:88px;z-index:7;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--muted);background:var(--glass);border:1px solid var(--rule);padding:7px 12px;text-transform:uppercase}

@media (max-width:1080px){
  #info{width:280px}
  #caption{width:min(620px,calc(100vw - 260px))}
}
@media (max-width:860px){
  header{gap:12px;padding:0 12px}
  .brand .kick{display:none}
  #rail{left:0;right:0;top:auto;bottom:76px;width:auto;height:auto;padding:0;display:flex;overflow-x:auto;
    border-right:0;border-top:1px solid var(--rule)}
  #rail h2,#rail .foot{display:none}
  #rail button{border-bottom:0;border-right:1px solid var(--rule);padding:8px 14px;white-space:nowrap;width:auto}
  #rail .t{font-size:14px}
  #promptbar{left:0}
  #legend,#hint{display:none}
  #info{left:12px;right:12px;width:auto;top:auto;bottom:140px;max-height:38vh}
  #caption{bottom:140px;width:calc(100vw - 24px)}
}
</style>
</head>
<body>

<div class="rule-top"></div>
<header>
  <div class="brand">
    <a href="/">Divy&rsquo;s</a>
    <span class="kick">Plates &middot; From river to token</span>
  </div>
  <div class="tools">
    <button class="mono-btn btn-run" id="trace">Guided trace</button>
    <span class="divider"></span>
    <span class="zoomlvl" id="zoomlvl">100%</span>
    <button class="mono-btn" id="zout" aria-label="Zoom out">&minus;</button>
    <button class="mono-btn" id="zin" aria-label="Zoom in">+</button>
    <button class="mono-btn" id="zfit">Fit</button>
  </div>
</header>

<nav id="rail" aria-label="Figures">
  <h2>The plates</h2>
  <button data-stage="all"><span class="n">&mdash;</span><span class="t">Whole plate</span></button>
  <button data-stage="A"><span class="n">Fig. I</span><span class="t">Sources</span></button>
  <button data-stage="B"><span class="n">Fig. II</span><span class="t">The building</span></button>
  <button data-stage="C"><span class="n">Fig. III</span><span class="t">Rack B&middot;14</span></button>
  <button data-stage="D"><span class="n">Fig. IV</span><span class="t">The server</span></button>
  <button data-stage="E"><span class="n">Fig. V</span><span class="t">Inside the model</span></button>
  <div class="foot">
    Scroll &middot; zoom<br>
    Drag &middot; pan<br>
    Hover &middot; <b>what it does</b><br>
    Click &middot; pin the note
  </div>
</nav>

<aside id="info" hidden>
  <button class="close" aria-label="Close">&times;</button>
  <div class="tag"><i></i><span></span></div>
  <h3></h3>
  <p class="role"></p>
  <p class="desc"></p>
  <ul class="facts"></ul>
  <p class="pin"></p>
</aside>

<div id="caption" hidden>
  <div class="step"></div>
  <p></p>
  <div class="btns">
    <button class="mono-btn" id="capPrev">&larr; Prev</button>
    <button class="mono-btn" id="capNext">Next &rarr;</button>
    <button class="mono-btn" id="capPlay" aria-pressed="true">Pause</button>
    <button class="mono-btn" id="capStop">Close</button>
    <span class="dots"></span>
  </div>
</div>

<div id="legend">
  <span><i style="background:var(--c-water)"></i>Water in</span>
  <span><i style="background:var(--c-heat)"></i>Heat out</span>
  <span><i style="background:var(--c-power)"></i>Electricity</span>
  <span><i style="background:var(--c-data)"></i>Your prompt</span>
  <span><i style="background:var(--c-token)"></i>Answer tokens</span>
</div>
<div id="hint">Hover any part &middot; Esc to release</div>

<div id="promptbar">
  <span class="lab">Prompt</span>
  <span class="field">
    <span class="quote">&ldquo;</span>
    <input id="pin" type="text" spellcheck="false" autocomplete="off" value="Why is the sky blue?" aria-label="Prompt">
  </span>
  <button class="mono-btn btn-run" id="run">Generate &crarr;</button>
  <span class="out" id="out">idle<br><b></b></span>
</div>

<svg id="scene" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="1"/>
    </pattern>
    <pattern id="hatchD" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3.4" stroke="var(--hatch)" stroke-width="1"/>
    </pattern>
    <pattern id="hatchW" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--c-water)" stroke-width=".9" stroke-opacity=".5"/>
    </pattern>
    <pattern id="hatchP" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--c-power)" stroke-width=".9" stroke-opacity=".55"/>
    </pattern>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1" fill="var(--hatch)"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--muted)"/>
    </marker>
    <marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--c-token)"/>
    </marker>
    <marker id="arwD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--c-data)"/>
    </marker>
  </defs>
  <g id="world">
    <g id="L-bg"></g>
    <g id="L-base"></g>
    <g id="L-paths"></g>
    <g id="L-flows"></g>
    <g id="L-scene"></g>
    <g id="L-ui">
      <rect id="hilite" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="8 5" opacity="0" pointer-events="none" vector-effect="non-scaling-stroke"/>
    </g>
  </g>
</svg>

<script>
/* ======================================================================
   Plate library — everything is drawn as a printed engineering plate:
   hairline ink strokes on paper, hatching for mass, five spot inks.
   ====================================================================== */
const NS='http://www.w3.org/2000/svg', XL='http://www.w3.org/1999/xlink';
const $=id=>document.getElementById(id);
const svg=$('scene'), world=$('world');
const L={bg:$('L-bg'),base:$('L-base'),paths:$('L-paths'),flows:$('L-flows'),scene:$('L-scene'),ui:$('L-ui')};
const C={
  water:'var(--c-water)', heat:'var(--c-heat)', power:'var(--c-power)', data:'var(--c-data)', token:'var(--c-token)',
  ink:'var(--ink)', soft:'var(--ink-soft)', muted:'var(--muted)', rule:'var(--rule)', mid:'var(--rule-mid)',
  paper:'var(--paper)', deep:'var(--paper-deep)', sink:'var(--paper-sink)', accent:'var(--accent)',
  tW:'var(--t-water)', tH:'var(--t-heat)', tD:'var(--t-data)', tT:'var(--t-token)'
};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

function el(tag,attrs={},parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs){ if(attrs[k]==null) continue; if(k==='text') e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); }
  if(parent) parent.appendChild(e); return e;
}
const g=(p,a)=>el('g',a||{},p);
const rect=(p,x,y,w,h,a)=>el('rect',{x,y,width:w,height:h,...a},p);
const circ=(p,cx,cy,r,a)=>el('circle',{cx,cy,r,...a},p);
const line=(p,x1,y1,x2,y2,a)=>el('line',{x1,y1,x2,y2,...a},p);
const path=(p,d,a)=>el('path',{d,...a},p);
const txt=(p,x,y,s,a)=>el('text',{x,y,text:s,...a},p);
const poly=(p,pts,a)=>el('polygon',{points:pts,...a},p);

/* a machine: paper body, ink hairline, optional hatched face */
const body=(p,x,y,w,h,a)=>rect(p,x,y,w,h,{fill:C.deep,stroke:C.soft,'stroke-width':1.2,...a});
const shade=(p,x,y,w,h,a)=>rect(p,x,y,w,h,{fill:'url(#hatch)',stroke:'none',...a});
const dark =(p,x,y,w,h,a)=>rect(p,x,y,w,h,{fill:C.sink,stroke:C.mid,'stroke-width':.8,...a});
/* printed caption: rule, mono name, italic descriptor */
function cap(p,cx,y,name,sub,w=210){
  line(p,cx-w/2,y-14,cx+w/2,y-14,{stroke:C.mid,'stroke-width':1});
  txt(p,cx,y+2,name.toUpperCase(),{class:'lbl','text-anchor':'middle'});
  if(sub) txt(p,cx,y+22,sub,{class:'note-s','text-anchor':'middle'});
  return p;
}
function hot(e,id){ e.classList.add('hot'); e.setAttribute('data-info',id); return e; }

/* ------------------------------------------------------------- geometry */
const F={
  A:{x:40,   y:60, w:1500,h:1300, num:'I',   t:'Sources',            s:'Water, electricity and your prompt all begin far from the building'},
  B:{x:1620, y:60, w:2020,h:1300, num:'II',  t:'The building',        s:'Fibre, power and water cross the fence; one hall is opened up'},
  C:{x:3720, y:60, w:780, h:1300, num:'III', t:'Rack B·14',      s:'A 42U cabinet: four GPU servers, two switches, forty kilowatts'},
  D:{x:4580, y:60, w:1220,h:1300, num:'IV',  t:'The server, lid off', s:'Eight GPUs holding one model between them'},

};

const LAY={};
function layers(k){
  if(LAY[k]) return LAY[k];
  const f=F[k]; const t=f?`translate(${f.x} ${f.y})`:null;
  const mk=parent=>t?g(parent,{transform:t}):g(parent);
  return LAY[k]={b:mk(L.base),p:mk(L.paths),fl:mk(L.flows),s:mk(L.scene)};
}
function plate(k){
  const f=F[k];
  const fg=g(L.bg,{transform:`translate(${f.x} ${f.y})`});
  rect(fg,0,0,f.w,f.h,{fill:C.paper,stroke:C.mid,'stroke-width':1.2});
  rect(fg,10,10,f.w-20,f.h-20,{fill:'none',stroke:C.rule,'stroke-width':.8});
  txt(fg,54,64,'FIG.',{class:'fig-kick'});
  txt(fg,52,122,f.num,{class:'fig-num'});
  txt(fg,132,100,f.t,{class:'fig-ttl'});
  txt(fg,132,132,f.s,{class:'fig-sub'});
  line(fg,40,158,f.w-40,158,{stroke:C.mid,'stroke-width':1});
  line(fg,40,163,f.w-40,163,{stroke:C.rule,'stroke-width':1});
  return layers(k);
}
function band(p,x,y,n,label){
  txt(p,x,y,n,{class:'lbl-s',fill:C.accent});
  txt(p,x+38,y,label.toUpperCase(),{class:'lbl-s'});
  return p;
}

/* ------------------------------------------------------- moving matter */
let pid=0;
function flow(k,p,color,o={}){
  const {n=6,dur=6,r=3,rev=false,delay=0}=o; const l=layers(k);
  for(let i=0;i<n;i++){
    const gg=g(l.fl);
    circ(gg,0,0,r,{fill:color});
    circ(gg,0,0,r*2.4,{fill:color,opacity:.16});
    const am=el('animateMotion',{dur:dur+'s',repeatCount:'indefinite',begin:(-(i/n)*dur-delay)+'s'},gg);
    if(rev){am.setAttribute('keyPoints','1;0');am.setAttribute('keyTimes','0;1');am.setAttribute('calcMode','linear');}
    const mp=el('mpath',{},am); mp.setAttributeNS(XL,'xlink:href','#'+p.id); mp.setAttribute('href','#'+p.id);
  }
}
function conduit(k,d,color,o={}){
  const l=layers(k); const {w=4,alpha=.34,dash=null,n=6}=o;
  if(w>0) path(l.b,d,{fill:'none',stroke:color,'stroke-width':w,'stroke-opacity':alpha,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':dash});
  const p=path(l.p,d,{fill:'none',stroke:'none',id:'mp'+(pid++)});
  if(n>0) flow(k,p,color,o);
  return p;
}
function hero(k,p,color,dur){
  const l=layers(k); const gg=g(l.fl,{opacity:0});
  circ(gg,0,0,13,{fill:color,opacity:.18}); circ(gg,0,0,6,{fill:color,stroke:C.paper,'stroke-width':1.5});
  const am=el('animateMotion',{dur:dur+'s',begin:'indefinite',fill:'freeze'},gg);
  const mp=el('mpath',{},am); mp.setAttributeNS(XL,'xlink:href','#'+p.id); mp.setAttribute('href','#'+p.id);
  return {play(){ gg.setAttribute('opacity',1); try{am.beginElement();}catch(e){} setTimeout(()=>gg.setAttribute('opacity',0),dur*1000+200); }};
}
function fan(p,cx,cy,r,dur=2,blades=5,color){
  const gg=g(p);
  circ(gg,cx,cy,r,{fill:C.paper,stroke:C.soft,'stroke-width':1});
  const b=g(gg);
  for(let i=0;i<blades;i++) el('ellipse',{cx,cy:cy-r*.5,rx:r*.2,ry:r*.4,fill:'none',stroke:color||C.muted,'stroke-width':1.1,transform:`rotate(${i*360/blades} ${cx} ${cy})`},b);
  circ(gg,cx,cy,r*.16,{fill:C.soft});
  el('animateTransform',{attributeName:'transform',type:'rotate',from:`0 ${cx} ${cy}`,to:`360 ${cx} ${cy}`,dur:dur+'s',repeatCount:'indefinite'},b);
  return gg;
}
const led=(p,cx,cy,color,delay,fast)=>rect(p,cx-1.2,cy-1.2,2.4,2.4,{fill:color,class:'led'+(fast?' fast':''),style:`animation-delay:${delay}s`});
const arrow=(p,d,color,w=1.2,m='arw')=>path(p,d,{fill:'none',stroke:color||C.muted,'stroke-width':w,'marker-end':`url(#${m})`});
const leader=(p,x1,y1,x2,y2)=>path(p,`M${x1},${y1} L${x2},${y2}`,{fill:'none',stroke:C.mid,'stroke-width':.9,'stroke-dasharray':'2 3'});
const hitbox=(p,x,y,w,h,id)=>hot(rect(p,x,y,w,h,{fill:'transparent',class:'hit'}),id);
</script>

  const kv=hot(g(s),'kvcache');

  el('ellipse',{cx:685,cy:y+66,rx:22,ry:6,fill:C.deep,stroke:C.soft,'stroke-width':.9},kv);
  txt(kv,685,y+88,'KV CACHE',{class:'lbl-xs','text-anchor':'middle'});
  const ar=nb(732,84,'All-reduce','allreduce',C.water); for(let k=0;k<8;k++) led(ar,744+k*9,y+64,C.water,(k*.15)%1.2,true);
  nb(828,56,'Norm','norm');
  const ml=nb(896,330,'MLP (feed-forward)','mlp');
  [[910,36],[952,84],[1044,36]].forEach(([x,w])=>rect(ml,x,y+50,w,20,{fill:C.paper,stroke:C.soft,'stroke-width':.8}));
  txt(ml,1092,y+64,'up ×4 · SwiGLU · down',{class:'lbl-xs'});
  txt(ml,1216,y+38,'what does that pattern mean?',{class:'note-s','text-anchor':'end'});
  const ar2=nb(1238,84,'All-reduce','allreduce',C.water); for(let k=0;k<8;k++) led(ar2,1250+k*9,y+64,C.water,(k*.15+.4)%1.2,true);
  path(b,`M1334,${y+50} H1360 V${y+88} H126`,{fill:'none',stroke:C.mid,'stroke-width':1,'stroke-dasharray':'4 3','marker-end':'url(#arw)'});
  txt(s,1226,y+92,'added back into the residual stream',{class:'note-s','text-anchor':'end'});
  const sp=path(layers('E').p,`M110,${y+50} H1340`,{fill:'none',stroke:'none',id:'mp'+(pid++)});
  sweeps.push(hero('E',sp,C.data,.65));
  if(li===2) txt(s,780,760,'· · ·   layers 4 – 79, identical   · · ·',{class:'note','text-anchor':'middle'});
});
MV.sweeps=sweeps;

band(s,60,932,'5·3','One vector becomes one token');
{ const fn=hot(g(s),'finalnorm'); body(fn,60,952,116,46); txt(fn,118,980,'FINAL NORM',{class:'lbl-xs','text-anchor':'middle',fill:C.ink}); }
arrow(s,'M180,975 H202',C.muted);
{ const lh=hot(g(s),'lmhead'); body(lh,206,952,190,46); txt(lh,301,980,'LM HEAD',{class:'lbl-s','text-anchor':'middle',fill:C.ink}); txt(lh,206,1016,'12,288 → VOCABULARY',{class:'lbl-xs'}); }
arrow(s,'M400,975 H422',C.muted);

MV.bars=[]; MV.barLbl=[]; MV.barP=[];
{ const lg=hot(g(s),'logits');

arrow(s,'M954,975 H976',C.muted);
{ const sm=hot(g(s),'sampler'); body(sm,980,952,142,46); txt(sm,1051,980,'SAMPLE',{class:'lbl-s','text-anchor':'middle',fill:C.ink});

{ const nt=hot(g(s),'nexttoken');

{ const gs2=hot(g(s),'loop');
  rect(gs2,980,1092,520,116,{fill:C.paper,stroke:C.mid,'stroke-width':1,'stroke-dasharray':'5 4'});

  const fo=el('foreignObject',{x:992,y:1120,width:496,height:82,'pointer-events':'none'},gs2);

path(b,'M1500,1150 H1540 V240 H1046',{fill:'none',stroke:C.token,'stroke-width':1.2,'stroke-opacity':.55,'stroke-dasharray':'6 5','marker-end':'url(#arwT)'});
const P_LOOP=conduit('E','M1500,1150 H1540 V240 H1046',C.token,{w:0,n:4,dur:6,r:2.6});
txt(s,1588,700,'append the token, run the stack again',{class:'note-s',transform:'rotate(90 1588 700)','text-anchor':'middle'});

<script>
/* ======================================================================
   The marginalia — one note for every part
   ====================================================================== */
const TAGS={water:['Water','var(--c-water)'],power:['Electricity','var(--c-power)'],data:['Your prompt','var(--c-data)'],
            heat:['Heat','var(--c-heat)'],compute:['Compute','var(--c-token)'],net:['Network','var(--c-data)'],model:['Model','var(--c-token)']};
const INFO={
 user:{tag:'data',t:'Your device',r:'Where the prompt begins',d:'You type a question. The app wraps it in an HTTPS request, your device encrypts it, and it leaves over Wi-Fi or cellular towards the internet backbone.',f:['A few kilobytes leave; thousands of tokens may come back','Round trip to a distant data center: 30–150 ms','The answer arrives as a stream, one token at a time']},
 router:{tag:'net',t:'Home router',r:'The first hop of many',d:'Your router hands the packet to the ISP, which passes it up through regional aggregation onto the public internet. Nothing here understands the question — only the destination address.',f:['Wi-Fi to fibre in one box','Typically 5–15 hops in total']},
 fiber:{tag:'net',t:'Long-haul fibre',r:'Carries the request as pulses of light',d:'Glass strands thinner than a hair carry dozens of wavelengths at once. Routers along the way read the destination and hand the packet on until it reaches the data center’s carriers.',f:['One fibre pair: tens of Tb/s','Light in glass: ~200,000 km/s','The answer comes home the same way']},
 gas:{tag:'power',t:'Gas turbine plant',r:'Power that runs at three in the morning',d:'Natural gas burns in turbines that spin generators. Because it can run whenever asked, it supplies the always-on share of the load, with renewables layered on top.',f:['300–800 MW per plant','Generator voltage ~20 kV','A 100 MW campus is a small city’s worth of demand']},
 wind:{tag:'power',t:'Wind farm',r:'Contracted years in advance',d:'Operators sign power purchase agreements so that, over a year, they buy as much renewable energy as they consume. The electrons still arrive over the shared grid.',f:['3–6 MW per turbine','Best sites now matched hour by hour']},
 solar:{tag:'power',t:'Solar farm',r:'Cheap at noon, nothing at midnight',d:'Solar is the cheapest energy ever built while the sun is up. Batteries and the grid fill the gaps, because the building never turns off.',f:['Capacity factor 20–30 %','Almost always paired with storage']},
 battery:{tag:'power',t:'Grid batteries',r:'Move midday electricity into the evening',d:'Container-sized lithium packs charge on the solar surplus and discharge at peak. They also smooth the second-by-second swings a large AI cluster creates when a training job starts or stops.',f:['2–4 hours of storage is typical','A synchronised GPU cluster can swing tens of MW in seconds']},
 stepup:{tag:'power',t:'Step-up transformer',r:'Raises voltage so the wire stops wasting power',d:'Loss in a conductor grows with the square of the current, so the grid pushes voltage up — and current down — before sending power any distance.',f:['20 kV → 230–500 kV','Ten times the voltage, a hundredth of the loss']},
 towers:{tag:'power',t:'Transmission lines',r:'Hundreds of kilometres of steel and aluminium',d:'High-voltage lines connect generation to demand. A large AI campus often needs new lines built for it alone, which has become the slowest part of building one.',f:['230–500 kV AC','2–6 % lost end to end','Permitting outlasts construction']},
 reservoir:{tag:'water',t:'River or reservoir',r:'Where the cooling water starts',d:'Rivers, reservoirs, groundwater or reclaimed municipal water. Evaporative cooling consumes the most; the closed liquid loop in this building loses very little.',f:['Evaporative sites: 1–5 million litres a day','Closed loops: a small fraction of that','Water use is now reported next to energy use']},
 intake:{tag:'water',t:'Intake and pumps',r:'Screens, then pressure',d:'A screen keeps fish, weed and silt out. Pumps then lift the water and hold pressure across kilometres of pipe so the towers upstream stay full.',f:['A few percent of the cooling energy budget']},
 pump:{tag:'water',t:'Pumping station',r:'Pressurises the supply main',d:'Pumps move water uphill and through kilometres of pipe to the site, keeping enough pressure for the cooling towers to draw on.',f:['Runs continuously, sized for peak summer load']},
 treatment:{tag:'water',t:'Treatment',r:'So the water does not eat the plant',d:'Filtration removes silt, softening removes the minerals that would scale the pipes, and biocide dosing keeps Legionella and biofilm out of the towers.',f:['Towers concentrate minerals as water evaporates','Some water is periodically blown down and replaced']},
 tank:{tag:'water',t:'Buffer tank',r:'A day in hand',d:'Stored make-up water lets the site ride through a mains interruption without shedding load — the same logic as the fuel tanks next to the generators.',f:['Sized for roughly 24 hours of evaporation']},
 meetme:{tag:'net',t:'Meet-me room',r:'Where the outside fibre ends',d:'Each carrier’s fibre terminates on patch panels here. Edge routers scrub attacks, complete the TLS handshake and pass legitimate requests to the internal network.',f:['Several carriers, on physically separate routes','The first place in the building that sees your bytes']},
 switchgear:{tag:'power',t:'Medium-voltage switchgear',r:'The building’s main breaker',d:'Takes the 34.5 kV feed, protects against faults and meters consumption. If the utility drops, it transfers the load to the generators.',f:['Two feeds, automatic transfer','Arc-flash rated, operated remotely']},
 ups:{tag:'power',t:'UPS and batteries',r:'Bridges ten seconds of darkness',d:'The UPS cleans incoming power and, when the grid fails, its batteries carry the whole hall for the few seconds the generators need to start and take load.',f:['5–10 minutes of runtime','Replaced roughly every decade','Some training halls deliberately skip it']},
 pduroom:{tag:'power',t:'Transformers',r:'Down to the voltage a rack can use',d:'Step-down transformers convert 34.5 kV to 415 V three-phase, then panels feed the overhead busways in each hall.',f:['34.5 kV → 415 V','Independent A and B paths, all the way to the server']},
 gen:{tag:'power',t:'Backup generators',r:'Keeps the site alive without the grid',d:'Diesel or gas sets start within seconds and can run for days on stored fuel. They are tested monthly and almost never needed in anger.',f:['On load in under 10 s','48–72 hours of fuel on site','Sized for the entire building']},
 coolingtower:{tag:'heat',t:'Cooling towers',r:'Give the heat to the sky',d:'Warm facility water trickles over fill while fans pull air through it. A little of it evaporates, and that is what actually carries the heat away — and what consumes the water.',f:['~1.1 kW rejected per kW of IT load','1–2 % of the flow evaporates each pass','A cold climate can skip the chillers most of the year']},
 chillers:{tag:'heat',t:'Chillers',r:'Only on the hot days',d:'A refrigeration cycle chills the facility water when outside air is too warm for the towers alone. Liquid-cooled halls run warm enough that this is a part-time job.',f:['Facility water at 18–25 °C','The single largest overhead in cooling energy']},
 cdu:{tag:'water',t:'Coolant distribution unit',r:'Two loops that never touch',d:'A heat exchanger moves heat from the clean technology loop — the one that touches the GPUs — into the facility loop. Pumps push coolant to the racks; sensors watch pressure and hunt for leaks.',f:['Supply ~25 °C, return ~45 °C','One unit per row, or one per rack','Treated coolant with corrosion inhibitors']},
 spine:{tag:'net',t:'Spine switches',r:'Choose which rack answers you',d:'A leaf-spine fabric lets any rack reach any other at full speed. A load balancer picks a server with free capacity, and your packet is forwarded to that rack’s top-of-rack switch.',f:['400 G and 800 G ports','A front-end network for users, a separate back-end fabric for GPU-to-GPU traffic','Microseconds per hop']},
 busway:{tag:'power',t:'Overhead busway',r:'A copper rail above the row',d:'Rather than run thick cable to every cabinet, a rigid busway runs the length of the row and each rack taps in with a plug-in box.',f:['415 V three-phase','An A busway and a B busway, on separate paths']},
 pdu:{tag:'power',t:'Power distribution unit',r:'Feeds one row',d:'Breakers per row and metering per circuit. Two units feed every rack, so a single failure never takes a server down.',f:['Metered to the watt for billing and capacity planning']},
 fanwall:{tag:'heat',t:'Fan wall',r:'For the heat liquid cannot reach',d:'Even in a liquid-cooled hall, memory, NICs and drives still shed heat into the air. Fan walls draw hot-aisle air through coils and return it cold.',f:['20–30 % of the heat is still moved by air','Speed follows the hall temperature']},
 coldaisle:{tag:'heat',t:'Cold aisle containment',r:'Stops supply air mixing with exhaust',d:'Racks face one another so their intakes share a sealed aisle. Doors and a roof keep the cold air where it is useful, which lets the whole hall run warmer.',f:['Supply air about 22 °C','Containment cuts fan energy dramatically']},
 hotaisle:{tag:'heat',t:'Hot aisle',r:'Where the exhaust collects',d:'Server fans push warm air out of the back of each cabinet, and the fan wall draws it back through the cooling coils.',f:['Exhaust 35–45 °C']},
 techloop:{tag:'water',t:'Technology loop',r:'Coolant pipes under the floor',d:'Supply and return mains run beneath the raised floor with a tap for every rack. Quick-disconnect couplings let a cabinet be pulled without draining the loop.',f:['Supply 25 °C, return 45 °C','Roughly a litre a second per rack']},
 rack:{tag:'compute',t:'A rack',r:'One of thirty-two in this hall',d:'Every cabinet here is the same: switches on top, four GPU servers, power and coolant from below. Your request could have landed in any of them — the load balancer chose B-14.',f:['32 racks × 32 GPUs = 1,024 GPUs in this hall','About 40 kW each']},
 rack14:{tag:'compute',t:'Rack B-14',r:'The cabinet your prompt was sent to',d:'A 42U cabinet in row B. Two top-of-rack switches, four eight-GPU servers, power strips down both sides and a coolant manifold at the back. Figure III opens it up.',f:['32 GPUs, about 40 kW','Cold plates for the GPUs, air for everything else','Fibre uplinks to the spine overhead']},
 tor:{tag:'net',t:'Top-of-rack switch',r:'The last hop before the server',d:'Every server’s NICs plug into these two switches, which uplink to the spine. There are two so that a failure never isolates the cabinet.',f:['32 × 400 G ports each','About a microsecond to forward a packet','Your answer leaves the same way it arrived']},
 mgmt:{tag:'net',t:'Management switch',r:'Out-of-band control',d:'A slow, separate network lets operators reboot a node, update firmware and read sensors even when the main network is down.',f:['1 G to each server’s baseboard controller']},
 rackpdu:{tag:'power',t:'Rack power strips',r:'Two independent cords per server',d:'Vertical strips on both sides take 415 V three-phase from the busway and give every node an A and a B feed.',f:['60 A per phase','Per-outlet metering and remote switching']},
 manifold:{tag:'water',t:'Coolant manifold',r:'Feeds every node in the cabinet',d:'Supply and return pipes run up the back of the rack with quick-disconnects at each node. Inside the server the coolant reaches the cold plates on the GPUs.',f:['25 °C in, 45 °C out','About a kilowatt of heat carried away per GPU']},
 server:{tag:'compute',t:'GPU server',r:'An identical node, other people’s requests',d:'Each of the four nodes runs the same model for different users, or a different model entirely. Nothing about it is special until the load balancer picks it.',f:['8 GPUs, 2 CPUs, about 10 kW']},
 server2:{tag:'compute',t:'GPU server 2',r:'The node running your prompt',d:'An 8U chassis holding eight GPUs on one board, two CPUs, two terabytes of memory and eight 400 G NICs. The eight GPUs together hold one copy of the model. Figure IV takes the lid off.',f:['About 10 kW at full tilt','Fans and drives at the front; NICs, power and coolant at the back','Serves many users at once by batching them together']},
 blank:{tag:'compute',t:'Blanking panels',r:'Empty space, kept sealed',d:'Unused units are blanked off so cold air cannot short-circuit from the cold aisle straight into the hot aisle without passing through a server.',f:['The cheapest efficiency measure in the building']},
 cpu:{tag:'compute',t:'CPUs',r:'The conductor, not the orchestra',d:'The CPUs run the serving software: tokenising your text, scheduling requests into batches, managing memory and launching work on the GPUs. Almost none of the arithmetic happens here.',f:['64–128 cores each','Tokeniser and sampler run on this side','Talks to the GPUs over PCIe']},
 dram:{tag:'compute',t:'System memory',r:'Staging area for the weights',d:'Model weights are read from disk into DRAM and copied into GPU memory once at startup. During serving it holds request queues and any KV cache that spills.',f:['About 2 TB per node','Far larger than HBM, and far slower']},
 pcie:{tag:'net',t:'PCIe switches',r:'Wire the NICs to the GPUs',d:'PCIe Gen 5 links carry your tokens from the NIC straight into GPU memory without the CPU ever touching them.',f:['64 GB/s each way per ×16 link','GPUDirect skips the copy through system memory']},
 psu:{tag:'power',t:'Power supplies',r:'415 V down to under a volt',d:'Four supplies — three needed, one spare — turn 415 V AC into 54 V DC. Regulators beside each GPU take that below one volt at over a thousand amps.',f:['About 95 % efficient','Nearly all ten kilowatts leaves again as heat']},
 nvswitch:{tag:'net',t:'NVLink fabric',r:'Makes eight chips behave like one',d:'Every layer is split across the eight GPUs. After each attention and MLP block they exchange partial results over NVLink, which is far faster than PCIe or Ethernet.',f:['900 GB/s per GPU, any to any','Two exchanges per layer — about 160 per token','A few microseconds each']},
 gpu:{tag:'compute',t:'GPU',r:'Holds one eighth of the model',d:'All eight are identical. Each stores a slice of every weight matrix and computes its slice of every layer in lockstep with the other seven.',f:['~18,000 cores','141 GB of HBM','2–4 PFLOPS at 8-bit precision']},
 gpu6:{tag:'compute',t:'GPU 6',r:'The chip predicting your next word',d:'Your tokens arrive here from NIC 6. For every token, GPU 6 multiplies the current vector by its slice of every weight matrix in all eighty layers, synchronising with its neighbours after each block. Figure V is what that computation actually is.',f:['About 700 W, taken away by liquid','Generation is limited by memory bandwidth, not arithmetic','Dozens of users share it in one batch']},
 hbm:{tag:'compute',t:'HBM stacks',r:'Where the weights live',d:'High-bandwidth memory is stacked in three dimensions beside the die. Every single token requires reading the whole model slice out of HBM, so its bandwidth sets how fast words appear.',f:['141 GB per GPU at about 5 TB/s','A 400-billion-parameter model in 8-bit fits across eight of them','The KV cache lives here too']},
 coldplate:{tag:'water',t:'Cold plate',r:'Liquid, a millimetre above the silicon',d:'A copper plate with microscopic channels sits on each GPU. Coolant enters at 25 °C, leaves near 45 °C and carries away close to a kilowatt per chip — which air alone could not do.',f:['About 1 kW per GPU','What makes 40–130 kW cabinets possible']},
 nic:{tag:'net',t:'400 G network cards',r:'The doorway into GPU memory',d:'Each GPU has its own card. It carries your request from the front-end network and, for models too large for one node, GPU-to-GPU traffic across the back-end fabric.',f:['400 Gb/s each — 3.2 Tb/s per node','RDMA writes directly into HBM']},
 prompt:{tag:'model',t:'The prompt',r:'Your text, plus what you cannot see',d:'Before the model reads a word, the server prepends a system prompt and wraps everything in a chat template so the model knows which part is you and which part is it.',f:['System prompt: standing instructions from the provider','Chat template: role markers around every turn']},
 tokenizer:{tag:'model',t:'Tokeniser',r:'Turns text into numbers',d:'Byte-pair encoding splits your text into common chunks — roughly three-quarters of a word each — and looks every chunk up in a fixed vocabulary. It runs on the CPU in microseconds.',f:['Vocabulary around 128,000 entries','Common words are one token; rare ones shatter into pieces']},
 tokens:{tag:'model',t:'The sequence',r:'Every position, and what is kept for it',d:'Each chip is one position: its number, the chunk of text, and the ID that is really all the model sees. The bar above shows how strongly the token being predicted right now leans on that position. The two strips below are its cached key and value vectors — the newest position is written in red, everything before it is read back from memory.',f:['White chips: your prompt · green chips: what the model has written','Position numbers never restart — the cache is addressed by them','Context windows are measured in exactly these']},
 embed:{tag:'model',t:'Embedding',r:'Each token becomes a long vector',d:'A lookup table turns every ID into a vector of thousands of numbers, and position information is folded in so the model knows the order of your words.',f:['Vector width around 12,000','Rotary position embeddings, applied inside attention']},
 stats:{tag:'model',t:'The running total',r:'What this request costs',d:'Context length is everything the model must attend to. The KV cache is the memory holding it. The pass count is how many times the entire eighty-layer stack has been executed for you.',f:['One pass = one token','Cache grows with every token, for every user in the batch']},
 layer:{tag:'model',t:'A transformer layer',r:'One of about eighty identical blocks',d:'Each layer refines every token’s vector: attention gathers context from earlier tokens, the MLP transforms it, and both results are added back into the residual stream running down the stack.',f:['Norm → attention → add → norm → MLP → add','All eighty run for every token generated','Each one split across all eight GPUs']},
 norm:{tag:'model',t:'Normalisation',r:'Keeps the numbers civil',d:'Rescales each vector before the expensive blocks so that activations neither explode nor vanish as they pass down eighty layers.',f:['RMSNorm — a multiply and a reciprocal square root']},
 attn:{tag:'model',t:'Self-attention',r:'Which earlier tokens matter right now?',d:'Each token forms a query; every earlier token offers a key and a value. Query-key scores decide how much to look at each, and the values are blended in those proportions. Many heads do this at once, each hunting for something different.',f:['“blue” attends hard to “sky”','64–128 heads per layer','The only place tokens are allowed to talk to each other']},
 kvcache:{tag:'model',t:'KV cache',r:'Two vectors kept for every position',d:'When a token passes through a layer it produces three projections of its vector: a query, a key and a value. The query is used once and thrown away, but the key and the value are what every later token will ask about — so they are written to memory and never computed again. Each position in the strip above therefore holds one K and one V per layer: eighty of each, for every token, for the whole conversation.',f:['Cached: the key and value projections — not the whole layer computation','Recomputed each pass: only the newest token','Roughly 0.3 MB per token across all eighty layers','Drop the cache and every token would reprocess the entire prompt']},
 allreduce:{tag:'net',t:'All-reduce',r:'Eight slices agree on one answer',d:'Each GPU computed a partial result from its slice of the weights. They sum their partials over NVLink so that every GPU ends the block holding the same full activation.',f:['Twice per layer, about 160 times per token','A few microseconds each','This is why NVLink bandwidth is worth paying for']},
 mlp:{tag:'model',t:'MLP',r:'Where most of the knowledge sits',d:'The vector is projected to about four times its width, passed through a nonlinearity and squeezed back down. Roughly two-thirds of the model’s parameters live in these matrices.',f:['Up-project, SwiGLU, down-project','Every token processed independently','Most of the arithmetic per token']},
 finalnorm:{tag:'model',t:'Final normalisation',r:'One last tidy',d:'The vector for the newest position is normalised a final time before it is turned into scores.',f:[]},
 lmhead:{tag:'model',t:'Language-model head',r:'A score for every possible token',d:'One last matrix multiplies the vector into a score for every entry in the vocabulary. Higher means “more likely to come next”.',f:['12,288 numbers in, ~128,000 out','Often shares its weights with the embedding table']},
 logits:{tag:'model',t:'Logits and probabilities',r:'The model’s ranked guesses',d:'Softmax turns raw scores into probabilities that sum to one. Only the leading few carry real weight; the rest of the vocabulary is a rounding error.',f:['Temperature flattens or sharpens the curve','Top-p keeps only the most probable mass']},
 sampler:{tag:'model',t:'Sampling',r:'Picks one, then commits to it',d:'Rather than always taking the top guess, the server draws at random in proportion to probability. That is why the same question can be answered slightly differently twice.',f:['Temperature 0 always takes the leader','Runs back on the CPU, in microseconds']},
 nexttoken:{tag:'model',t:'The next token',r:'The entire output of one pass',d:'Eighty layers, hundreds of matrix multiplications, sixteen gigabytes of weights read out of memory, twenty megawatts of building — for one word-piece. Then it all happens again.',f:['20–50 tokens per second per user','A 300-word answer is roughly 400 passes','Every pass reads the whole model out of HBM']},
 loop:{tag:'model',t:'The autoregressive loop',r:'Until the model decides to stop',d:'The new token is appended and fed back in. Thanks to the KV cache only that one token needs processing. Generation ends when the model emits its end-of-turn token.',f:['Tokens stream back over the same fibre, in reverse','GPU 6 is juggling many people’s loops at once']},
};
</script>
