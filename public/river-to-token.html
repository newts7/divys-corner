const wide=()=>innerWidth>860;
function viewport(){
  const padL=wide()?212:0, padT=62, padB=wide()?86:150;
  return {x:padL,y:padT,w:Math.max(260,innerWidth-padL),h:Math.max(200,innerHeight-padT-padB)};
}
let flyReq=null;
function flyTo(target,ms=1000){
  if(flyReq) cancelAnimationFrame(flyReq);
  const v=viewport(), mx=v.x+v.w/2, my=v.y+v.h/2;
  if(REDUCED||ms===0){ Object.assign(cam,target); apply(); return; }
  const c0={x:(mx-cam.x)/cam.s,y:(my-cam.y)/cam.s}, c1={x:(mx-target.x)/target.s,y:(my-target.y)/target.s};
  const s0=Math.log(cam.s), s1=Math.log(target.s), t0=performance.now();
  const step=now=>{ let t=Math.min(1,(now-t0)/ms); t=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    const s=Math.exp(s0+(s1-s0)*t), cx=c0.x+(c1.x-c0.x)*t, cy=c0.y+(c1.y-c0.y)*t;
    cam.s=s; cam.x=mx-cx*s; cam.y=my-cy*s; apply(); if(t<1) flyReq=requestAnimationFrame(step); };
  flyReq=requestAnimationFrame(step);
}
function fit(bx,by,bw,bh,pad=.06,ms=1000){
  const v=viewport();
  const s=Math.max(.02,Math.min(14,Math.min(v.w/(bw*(1+2*pad)), v.h/(bh*(1+2*pad)))));
  flyTo({s, x:v.x+v.w/2-(bx+bw/2)*s, y:v.y+v.h/2-(by+bh/2)*s}, ms);
}
let curStage='all', userMoved=false;
function fitFrame(k,ms){ curStage=k; if(k==='all') return fit(WORLD.x,WORLD.y,WORLD.w,WORLD.h,.02,ms); const f=F[k]; fit(f.x,f.y,f.w,f.h,.03,ms); }
function zoomAt(f,cx,cy){ userMoved=true; const s=Math.min(14,Math.max(.05,cam.s*f)); const k=s/cam.s; cam.x=cx-(cx-cam.x)*k; cam.y=cy-(cy-cam.y)*k; cam.s=s; apply(); }

svg.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(Math.exp(-e.deltaY*0.0016),e.clientX,e.clientY); },{passive:false});
const ptrs=new Map(); let dragging=false, moved=0, last=null, pinchD=0;
svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  last={x:e.clientX,y:e.clientY}; moved=0; dragging=true; svg.classList.add('dragging');
  if(ptrs.size===2){ const [a,b2]=[...ptrs.values()]; pinchD=Math.hypot(a.x-b2.x,a.y-b2.y); } });
svg.addEventListener('pointermove',e=>{ if(!dragging) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){ const [a,b2]=[...ptrs.values()]; const d=Math.hypot(a.x-b2.x,a.y-b2.y);
    const mx=(a.x+b2.x)/2,my=(a.y+b2.y)/2; if(pinchD) zoomAt(d/pinchD,mx,my); pinchD=d;
    if(last){cam.x+=mx-last.x;cam.y+=my-last.y;} last={x:mx,y:my}; apply(); return; }
  const dx=e.clientX-last.x, dy=e.clientY-last.y; moved+=Math.abs(dx)+Math.abs(dy);
  cam.x+=dx; cam.y+=dy; last={x:e.clientX,y:e.clientY}; userMoved=true; apply(); });
const endPtr=e=>{ ptrs.delete(e.pointerId); if(!ptrs.size){ dragging=false; svg.classList.remove('dragging'); }
  else { const [a]=[...ptrs.values()]; last={x:a.x,y:a.y}; pinchD=0; } };
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
$('zin').onclick=()=>{ const v=viewport(); zoomAt(1.45,v.x+v.w/2,v.y+v.h/2); };
$('zout').onclick=()=>{ const v=viewport(); zoomAt(1/1.45,v.x+v.w/2,v.y+v.h/2); };
$('zfit').onclick=()=>{ setStage('all'); };
function setStage(k){ stopTrace(); userMoved=false; fitFrame(k); document.querySelectorAll('#rail button').forEach(x=>x.classList.toggle('on',x.dataset.stage===k)); }
document.querySelectorAll('#rail button').forEach(b2=>b2.onclick=()=>setStage(b2.dataset.stage));
let rzT=null;
addEventListener('resize',()=>{ apply(); clearTimeout(rzT);
  rzT=setTimeout(()=>{ if(!userMoved&&traceI<0) fitFrame(curStage,0); },160); });

/* ======================================================================
   Hover and pin
   ====================================================================== */
const info=$('info'), hil=$('hilite'); let pinned=null, hideT=null;
function worldBBox(e){
  const bb=e.getBBox(); const m=world.getCTM().inverse().multiply(e.getCTM());
  const p=(x,y)=>{ const pt=svg.createSVGPoint(); pt.x=x; pt.y=y; return pt.matrixTransform(m); };
  const a=p(bb.x,bb.y), b2=p(bb.x+bb.width,bb.y+bb.height);
  return {x:a.x,y:a.y,w:b2.x-a.x,h:b2.y-a.y};
}
function showInfo(e){
  const id=e.getAttribute('data-info'), d=INFO[id]; if(!d) return; clearTimeout(hideT);
  const [tn,tc]=TAGS[d.tag];
  info.querySelector('.tag i').style.background=tc;
  info.querySelector('.tag span').textContent=tn;
  info.querySelector('h3').textContent=d.t;
  info.querySelector('.role').textContent=d.r;
  info.querySelector('.desc').textContent=d.d;
  info.querySelector('.facts').innerHTML=(d.f||[]).map(x=>`<li>${x}</li>`).join('');
  info.querySelector('.pin').textContent=pinned?'Pinned — click again or press Esc':'Click to pin this note';
  info.hidden=false;
  const bb=worldBBox(e);
  hil.setAttribute('x',bb.x-5); hil.setAttribute('y',bb.y-5);
  hil.setAttribute('width',bb.w+10); hil.setAttribute('height',bb.h+10);
  hil.setAttribute('opacity',1);
}
function hideInfo(){ if(pinned) return; hideT=setTimeout(()=>{ info.hidden=true; hil.setAttribute('opacity',0); },90); }
svg.addEventListener('pointerover',e=>{ if(pinned||dragging) return; const t=e.target.closest('.hot'); if(t) showInfo(t); });
svg.addEventListener('pointerout',e=>{ if(pinned) return; const t=e.target.closest('.hot'); if(t) hideInfo(); });
svg.addEventListener('click',e=>{ if(moved>6) return; const t=e.target.closest('.hot');
  if(!t){ pinned=null; hideInfo(); return; }
  if(pinned===t){ pinned=null; showInfo(t); } else { pinned=null; pinned=t; showInfo(t); } });
info.querySelector('.close').onclick=()=>{ pinned=null; info.hidden=true; hil.setAttribute('opacity',0); };
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ return; }
  if(e.key==='+'||e.key==='=') $('zin').click();
  if(e.key==='-') $('zout').click();
  if(e.key==='0') $('zfit').click();
  if(e.key==='ArrowRight'&&traceI>=0) $('capNext').click();
  if(e.key==='ArrowLeft'&&traceI>=0) $('capPrev').click();
  if(e.key==='Escape'){ pinned=null; info.hidden=true; hil.setAttribute('opacity',0); stopTrace(); }
});
</script>

<script>
/* ======================================================================
   A very small language model, running in your browser.

   The plate above describes what a real transformer does. Nothing that
   size fits in a web page, so the numbers you see are produced by an
   honest miniature: a byte-pair-ish tokeniser over a vocabulary built
   from the corpus below, and a trigram/bigram model with a topic term
   that leans on the words of your prompt. The same shape, six orders of
   magnitude less of it.
   ====================================================================== */
const CORPUS = `
Why is the sky blue? The sky looks blue because sunlight is scattered by the molecules of the air, and short blue wavelengths scatter far more strongly than long red ones. Sunlight arrives as a mixture of every colour. When it meets the tiny molecules of nitrogen and oxygen in the atmosphere, the light is scattered in all directions. The amount of scattering rises sharply as the wavelength gets shorter, so blue light bounces around the sky many times before it reaches your eye, while red light travels almost straight through. Our eyes are more sensitive to blue than to violet, and some violet is absorbed high in the atmosphere, so the sky settles on a deep blue.

Why are sunsets red? At sunset the light has to pass through much more air to reach you, so almost all of the blue has been scattered out of the beam long before it arrives. What is left is the red and orange end of the spectrum, which is why the sun looks warm and heavy near the horizon. Dust and smoke make the effect stronger. The same physics explains why the sky near the horizon looks pale: the light has been scattered so many times that the colours mix back towards white.

Why is the ocean blue? The ocean is blue partly because it reflects the sky and partly because water itself absorbs red light more strongly than blue. In a deep clear sea the red has been absorbed within the first few metres, so the light that comes back to your eye is blue. Shallow water over pale sand looks turquoise. Water full of plankton looks green, because the plankton absorb blue and red and reflect the green in between.

Why do we have seasons? The seasons come from the tilt of the Earth, not from its distance to the sun. The axis leans by about twenty three degrees, so for half of the year one hemisphere leans towards the sun and receives its light at a steeper angle and for longer each day. Steeper light means more energy per square metre of ground, and longer days mean more hours to collect it. That is summer. Six months later the same hemisphere leans away and gets the same light spread thin across a wider patch of ground, which is winter.

Why does it rain? Rain begins when warm air carrying water vapour rises and cools. Cold air can hold less water than warm air, so the vapour condenses onto tiny particles of dust and salt and forms droplets. Millions of droplets make a cloud. When the droplets collide and merge they grow heavy enough that the rising air can no longer hold them up, and they fall. The water cycle keeps repeating: the sun evaporates water from the ocean, the wind carries the vapour over land, the land cools it into rain, and rivers carry it back to the sea.

Why is the sea salty? Rain is slightly acidic, and over millions of years it has dissolved minerals out of rock and carried them down rivers into the ocean. Water leaves the ocean by evaporation, but the salt stays behind, so the concentration slowly climbs and then settles where new salt arriving balances salt locked away in sediment.

Why do we sleep? Sleep is when the brain does its maintenance. Memories from the day are replayed and consolidated, waste products that build up between the cells are flushed away, and the body repairs tissue and regulates its hormones. Losing sleep degrades attention and mood long before you notice it, because the parts of the brain that judge how tired you are get tired too.

Why do leaves change colour in autumn? Leaves are green because of chlorophyll, the pigment that captures light for photosynthesis. As the days shorten the tree stops making it, and the chlorophyll breaks down. The yellow and orange pigments were there all along, hidden under the green, and now they show. Some trees make new red pigments as they drain the last useful sugars out of the leaf before letting it fall.

How does an aeroplane fly? A wing is shaped and angled so that it pushes air downwards as it moves forward. Pushing air down means the air pushes the wing up by exactly as much, and when that upward force exceeds the weight of the aircraft it climbs. Engines do not lift the plane; they only keep it moving fast enough that the wing can.

Why does bread rise? Yeast eats the sugars in the flour and gives off carbon dioxide. The gluten in the dough forms an elastic net that traps the gas in thousands of small bubbles, so the dough swells. Heat in the oven makes the trapped gas expand faster, sets the protein and turns the outside brown.

Why does coffee keep you awake? A chemical called adenosine builds up in the brain through the day and makes you feel sleepy. Caffeine has a similar shape, so it sits in the same receptors without switching them on, and the sleepiness signal cannot get through. The adenosine keeps accumulating in the background, which is why the tiredness arrives all at once when the caffeine wears off.

How does the internet work? The internet is a network of networks that agree on how to pass small packets of data. Your message is chopped into packets, each stamped with a destination address. Routers read the address and pass each packet towards the destination, one hop at a time, over copper, fibre and radio. The packets can take different routes and arrive out of order, and the receiving computer puts them back together.

What is electricity? Electricity is the flow of charge through a conductor. A generator spins a magnet past coils of wire and pushes electrons back and forth; the grid carries that motion across the country at high voltage, because high voltage means low current and low current means very little energy lost as heat in the wires. Transformers step the voltage up for the journey and down again at the other end.

How does a computer work? A computer stores numbers in memory and follows a list of instructions that say how to move and combine them. Everything else is built on top of that. Text, images, sound and models are all numbers. The processor fetches an instruction, decodes it, does the arithmetic and writes the answer back, billions of times a second.

What is a data center? A data center is a building designed to keep computers powered and cool. Electricity arrives from a substation, passes switchgear and batteries and transformers, and reaches racks of servers over overhead busways. Nearly all of that energy leaves again as heat, which water carries out to the cooling towers in the yard outside.

How does a language model work? A language model reads text as a list of tokens and predicts the next one. The text is split by a tokeniser into common chunks, each chunk becomes a vector of numbers, and the vectors pass through a stack of transformer layers. In every layer attention lets each token gather information from earlier tokens, and a feed forward network transforms the result. At the end the model produces a score for every token in its vocabulary, the scores are turned into probabilities, and one token is chosen. Then the whole process runs again with that token appended. There is no plan and no draft: the answer is built one piece at a time, and the model reads everything it has already written before choosing what comes next.

What is attention? Attention is the part of the model where tokens are allowed to look at one another. Each token forms a query, every earlier token offers a key, and the match between them decides how much of that token value is mixed in. Many heads do this at the same time, each looking for a different kind of relationship, and the results are added back into the stream of numbers that runs down the stack.

Why do models make things up? A model is trained to produce plausible continuations, not to check facts. When it does not know something, the most plausible looking continuation is still a fluent sentence, so it writes one. Nothing in the machinery marks the difference between a fact it has seen a thousand times and a shape that merely looks right.

Why is training so expensive? Training reads an enormous amount of text and adjusts billions of numbers a tiny amount for each batch, over and over, for weeks. Every adjustment needs the whole model in memory, so the work is spread across thousands of chips that must talk to each other constantly. The cost is dominated by the energy and by the time the machines are held out of ordinary use.

What is a token? A token is a chunk of text, usually part of a word. Common words are a single token, rare words are broken into several, and a space at the front of a word belongs to the token. The model never sees letters, only the identity numbers of these chunks, which is why counting characters is oddly hard for it.

Why does the moon change shape? The moon does not change shape; we see a different part of its lit half as it moves around the Earth. Half of the moon is always in sunlight. When it sits between us and the sun we see the dark side, and when it is on the far side we see the whole lit face.

Why is the grass green? Grass is green because chlorophyll absorbs red and blue light to drive photosynthesis and reflects the green light in between. The plant is using the parts of sunlight that carry the most useful energy and throwing away the middle of the spectrum, which is the part our eyes are most sensitive to.

Why do we dream? Dreams seem to come from the brain replaying and recombining the day while the parts that check for consistency are quiet. That is why a dream can feel entirely reasonable while it is happening and absurd the moment you wake up.

How do batteries work? A battery holds two materials that would react if they could, separated so that the only path for the electrons is the circuit outside. When you close the circuit the reaction proceeds and pushes electrons through your device. Charging drives the reaction backwards and stores the energy again.

Why does the wind blow? Wind is air moving from high pressure to low pressure. The sun heats the ground unevenly, warm air rises and leaves lower pressure behind, and cooler heavier air flows in to replace it. The spin of the Earth bends those flows into the great circling patterns that carry weather around the planet.

What happens when you ask a question? The words leave your device as encrypted packets, travel over fibre to a data center, and land on a server holding a model. The text is tokenised, the tokens become vectors, the stack of layers runs once for every new token, and the answer streams back to you as it is produced. Water and electricity are being consumed the entire time, which is why the building around the chip is as much a part of the answer as the chip is.
`;

/* ----------------------------------------------------------- tokeniser */
const pieces=text=>text.match(/\s?[A-Za-z]+|\s?\d+|\s?[^\sA-Za-z0-9]|\s+/g)||[];
const VOCAB=new Map();
function addTok(t){ if(t&&!VOCAB.has(t)) VOCAB.set(t,200+VOCAB.size); }
(function buildVocab(){
  const freq=new Map();
  for(const p of pieces(CORPUS)){ if(/^\s+$/.test(p)) continue; freq.set(p,(freq.get(p)||0)+1); }
  const words=[...freq.entries()].sort((a,b)=>b[1]-a[1]);
  words.forEach(e=>addTok(e[0]));
  /* subword pieces, so an unseen word breaks into chunks rather than letters */
  const sub=new Map();
  for(const [w,n] of words){
    const bare=w.replace(/^ /,''); if(!/^[A-Za-z]+$/.test(bare)) continue;
    for(let L=2;L<=7;L++) for(let i=0;i+L<=bare.length;i++){
      const c=bare.slice(i,i+L);
      sub.set(c,(sub.get(c)||0)+n*(i===0?1.6:1));
    }
  }
  [...sub.entries()].filter(e=>e[1]>=3).sort((a,b)=>b[1]*b[0].length-a[1]*a[0].length)
    .slice(0,1500).forEach(e=>{ addTok(e[0]); addTok(' '+e[0]); });
  for(const ch of 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,!?;:()-/%$&*+=<>'){ addTok(ch); addTok(' '+ch); }
  addTok(' ');
})();
let MAXLEN=1; for(const t of VOCAB.keys()) if(t.length>MAXLEN) MAXLEN=t.length;
function encode(text){
  const out=[];
  for(let p of pieces(text)){
    if(/^\s+$/.test(p)) continue;
    if(VOCAB.has(p)){ out.push(p); continue; }
    let i=0;
    while(i<p.length){
      let hit=null;
      for(let L=Math.min(MAXLEN,p.length-i); L>=1; L--){ const c=p.slice(i,i+L); if(VOCAB.has(c)){ hit=c; break; } }
      if(!hit){ hit=p[i]; addTok(hit); }
      out.push(hit); i+=hit.length;
    }
  }
  return out;
}
const idOf=t=>VOCAB.get(t)||0;

/* --------------------------------- counts over the corpus, orders 1 to 5 */
const CORP=encode(CORPUS.replace(/\s+/g,' '));
const TOTAL=CORP.length;
const UNI=new Map(), POS=new Map(), NG=[null,null,new Map(),new Map(),new Map(),new Map()];
const key=(a,i,k)=>a.slice(i-k,i).join('');
CORP.forEach((t,i)=>{
  UNI.set(t,(UNI.get(t)||0)+1);
  if(!POS.has(t)) POS.set(t,[]);
  const arr=POS.get(t); if(arr.length<400) arr.push(i);
  for(let k=1;k<=4;k++){
    if(i<k) continue;
    const m=NG[k+1], kk=key(CORP,i,k);
    if(!m.has(kk)) m.set(kk,new Map());
    const d=m.get(kk); d.set(t,(d.get(t)||0)+1);
  }
});
const STOP=new Set([...UNI.entries()].sort((a,b)=>b[1]-a[1]).slice(0,28).map(e=>e[0]));
const isContent=t=>/[A-Za-z]{3,}/.test(t)&&!STOP.has(t);
const posOf=t=>POS.get(t)||POS.get(' '+t.trim())||POS.get(t.trim())||[];

/* the topic term: what tends to follow the content words you used */
function topicDist(toks){
  const d=new Map(), seen=new Set();
  for(const t of toks){
    if(!isContent(t)) continue;
    const k=t.trim().toLowerCase(); if(seen.has(k)) continue; seen.add(k);
    const ps=posOf(t), idf=Math.log(1+TOTAL/(1+(UNI.get(t)||1)));
    for(const p of ps) for(let o=1;o<=10;o++){
      const q=p+o; if(q>=TOTAL) break;
      d.set(CORP[q],(d.get(CORP[q])||0)+idf/(o*o*0.25+1));
    }
  }
  return d;
}
/* how much does each earlier token support this candidate? (the attention row) */
function support(seq,cand){
  const w=seq.map((t,i)=>{
    let s=0.05+0.55*Math.exp(-(seq.length-1-i)/4);
    if(isContent(t)){
      let co=0; for(const p of posOf(t)) for(let o=-8;o<=8;o++){ if(o&&CORP[p+o]===cand) co++; }
      s+=Math.min(2.2,co*0.32)*Math.log(1+TOTAL/(1+(UNI.get(t)||1)))/6;
    }
    return s;
  });
  const mx=Math.max(...w,1e-6);
  return w.map(x=>x/mx);
}
const normalise=m=>{ let s=0; for(const v of m.values()) s+=v; if(!s) return m; const o=new Map(); for(const e of m) o.set(e[0],e[1]/s); return o; };
function mix(into,src,weight){ if(!src||!src.size||weight<=0) return 0; for(const e of normalise(src)) into.set(e[0],(into.get(e[0])||0)+e[1]*weight); return weight; }

/* variable-order backoff: the longest context that has ever been seen wins */
function distribution(seq,topic,recent,lam){
  const p=new Map(); let rest=1;
  for(let k=4;k>=1;k--){
    if(seq.length<k) continue;
    const m=NG[k+1].get(key(seq,seq.length,k));
    if(m&&m.size){ mix(p,m,rest*0.74); rest*=0.26; }
  }
  mix(p,UNI,rest);
  if(topic&&topic.size&&lam){
    const tn=normalise(topic); let mx=0; for(const v of tn.values()) if(v>mx) mx=v;
    if(mx>0) for(const e of [...p]) p.set(e[0],e[1]*(1+lam*Math.pow((tn.get(e[0])||0)/mx,0.55)));
  }
  if(!recent.length) for(const e of [...p]) if(!/^ ?[A-Z]/.test(e[0])) p.set(e[0],e[1]*0.03);
  const tailN=recent.slice(-5);
  for(const e of [...p]){
    if(/^\s*[?]$/.test(e[0])) p.set(e[0],e[1]*0.05);
    if(tailN.includes(e[0])&&!/^[ ]?(the|a|of|to|and|is|in|that|it)$/.test(e[0].trim())) p.set(e[0],e[1]*0.45);
  }
  p.delete(seq[seq.length-1]);
  return normalise(p);
}
function sampleFrom(dist,temp,topp){
  let arr=[...dist].sort((a,b)=>b[1]-a[1]);
  if(temp!==1){ let s=0; const inv=1/Math.max(.05,temp);
    arr=arr.map(e=>{ const x=Math.pow(e[1],inv); s+=x; return [e[0],x]; }).map(e=>[e[0],e[1]/s]).sort((a,b)=>b[1]-a[1]); }
  let acc=0; const keep=[];
  for(const e of arr){ keep.push(e); acc+=e[1]; if(acc>=topp&&keep.length>=3) break; }
  const tot=keep.reduce((a,e)=>a+e[1],0);
  let r=Math.random()*tot;
  for(const e of keep){ r-=e[1]; if(r<=0) return e[0]; }
  return keep[0][0];
}
</script>

<script>
/* ======================================================================
   Driving figure V with whatever you typed
   ====================================================================== */
const TEMP=0.72, TOPP=0.92, MAXNEW=44;
const RUN={seq:[],plen:0,gen:[],topic:null,pass:0,weights:[],timers:[],live:false};
const show=t=>t.replace(/^ /,'·');

function clearTimers(){ RUN.timers.forEach(clearTimeout); RUN.timers=[]; }
const later=(ms,fn)=>RUN.timers.push(setTimeout(fn,ms));

function drawChips(){
  const G=MV.chipG; while(G.firstChild) G.removeChild(G.firstChild);
  const seq=RUN.seq, w=RUN.weights;
  let idx=seq.map((t,i)=>i);
  if(seq.length>22) idx=[...seq.keys()].slice(0,8).concat([-1],[...seq.keys()].slice(seq.length-13));
  const n=idx.length, cw=Math.min(112,Math.max(28,1440/n-5));
  idx.forEach((si,j)=>{
    const x=60+j*(cw+5);
    if(si<0){ txt(G,x+cw/2,364,'…',{class:'lbl','text-anchor':'middle'});
              txt(G,x+cw/2,402,'…',{class:'lbl-xs','text-anchor':'middle'}); return; }
    const t=seq[si], isGen=si>=RUN.plen, isLast=si===seq.length-1, a=w[si]||0;
    if(a>0.02) rect(G,x+1,330-a*24,cw-2,a*24,{fill:C.data,opacity:.5});
    txt(G,x+2,340,'#'+si,{class:'lbl-xs',style:'font-size:8px;letter-spacing:0'});
    rect(G,x,344,cw,32,{fill:isGen?C.tT:C.paper,stroke:isLast?C.accent:(isGen?C.token:C.data),'stroke-width':isLast?2:1});
    const fs=cw>64?11:(cw>44?9.5:8);
    const max=Math.max(1,Math.floor((cw-8)/(fs*0.62)));
    let d=show(t); if(d.length>max) d=d.slice(0,Math.max(1,max-1))+'…';
    txt(G,x+cw/2,365,d,{class:'lbl-xs','text-anchor':'middle',fill:C.ink,style:`font-size:${fs}px;letter-spacing:0`});
    if(cw>34) txt(G,x+cw/2,388,idOf(t),{class:'lbl-xs','text-anchor':'middle',style:'font-size:8.5px;letter-spacing:0'});
    /* the KV cache: one key and one value vector kept for this position, in every layer */
    const fresh=isLast&&RUN.live;
    [0,1].forEach(k=>{
      rect(G,x,394+k*9,cw,7,{fill:fresh?C.accent:C.token,opacity:fresh?.55:.28,stroke:C.mid,'stroke-width':.5});
      if(cw>40) txt(G,x+3,400+k*9,k?'V':'K',{class:'lbl-xs',style:'font-size:6px;letter-spacing:0',fill:C.ink});
    });
  });
}
function setStats(){
  const n=RUN.seq.length;
  MV.stats.textContent=`CONTEXT ${n} TOKENS   ·   KV CACHE ${(n*0.33).toFixed(1)} MB   ·   PASS ${RUN.pass}`;
}
function tail(str,n){ if(str.length<=n) return str.replace(/[<>&]/g,'');
  let t=str.slice(-n); const i=t.indexOf(' '); if(i>0&&i<14) t=t.slice(i+1);
  return '…'+t.replace(/[<>&]/g,''); }
function setAnswer(){
  const s=RUN.gen.join('');
  MV.answer.textContent=s.trim()+(RUN.live?' ▍':'');
  const el2=$('out');
  el2.innerHTML=(RUN.live?'generating · '+RUN.gen.length+' tokens':(RUN.gen.length?'done · '+RUN.gen.length+' tokens':'idle'))+
    '<br><b>'+tail(s.trim(),46)+'</b>';
}
function setCandidates(list){
  for(let i=0;i<8;i++){
    const c=list[i];
    if(!c){ MV.bars[i].style.transform='scaleY(0.02)'; MV.barLbl[i].textContent=''; MV.barP[i].textContent=''; continue; }
    MV.bars[i].style.transform='scaleY('+Math.max(0.02,Math.min(1,c[1]))+')';
    MV.bars[i].setAttribute('fill',i===0?C.token:C.mid);
    let d=show(c[0]); if(d.length>7) d=d.slice(0,6)+'…';
    MV.barLbl[i].textContent=d;
    MV.barP[i].textContent=c[1]>=0.005?Math.round(c[1]*100)+'%':'<1%';
  }
}

function startRun(text){
  clearTimers();
  const toks=encode(text.trim()||'Why is the sky blue?');
  RUN.seq=toks.slice(0,120); RUN.plen=RUN.seq.length; RUN.gen=[]; RUN.pass=0;
  RUN.ptoks=RUN.seq.slice(); RUN.topic=topicDist(RUN.seq); RUN.weights=[]; RUN.live=true;
  const shown=text.trim()||'Why is the sky blue?';
  MV.promptEcho.textContent=shown;
  const words=shown.split(/\s+/); let l1='',l2='';
  for(const w of words){ if((l1+' '+w).trim().length<=15&&!l2) l1=(l1+' '+w).trim();
    else if((l2+' '+w).trim().length<=15) l2=(l2+' '+w).trim(); }
  if(l2.length&&shown.length>l1.length+l2.length+1) l2=l2.slice(0,13)+'…';
  DEV[0].textContent=l1; DEV[1].textContent=l2;
  MV.samp.textContent='TEMPERATURE '+TEMP+' · TOP-P '+TOPP;
  MV.next.textContent=''; drawChips(); setStats(); setAnswer();
  step();
}
function stopRun(){ RUN.live=false; clearTimers(); setAnswer(); }

function step(){
  if(!RUN.live) return;
  if(RUN.gen.length) RUN.topic=topicDist(RUN.ptoks.concat(RUN.gen.slice(-8)));
  const dist=distribution(RUN.seq,RUN.topic,RUN.gen,RUN.gen.length<4?11:5);
  const top=[...dist].sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!top.length){ stopRun(); return; }
  RUN.pass++;
  const chosen=sampleFrom(dist,TEMP,TOPP);
  const beat=REDUCED?260:190;

  MV.attnCells.forEach(c=>c.style.animationDuration=(1.1+Math.random()*1.4)+'s');
  if(!REDUCED) MV.sweeps.forEach((sw,i)=>later(80+i*beat,()=>sw.play()));

  later(REDUCED?0:beat*4.4,()=>{
    RUN.weights=support(RUN.seq,top[0][0]); drawChips();
  });
  later(REDUCED?20:beat*5.6,()=>setCandidates(top));
  later(REDUCED?40:beat*7.4,()=>{
    MV.next.textContent='‘'+show(chosen)+'’';
    RUN.seq.push(chosen); RUN.gen.push(chosen);
    if(!REDUCED) MV.loopHero.play();
    drawChips(); setStats(); setAnswer();
    const done=RUN.gen.length>=MAXNEW ||
      (RUN.gen.length>=10 && /^\s*[.!?]$/.test(chosen)) ||
      (RUN.gen.length>=24 && /[.!?]/.test(chosen));
    if(done){ RUN.live=false; setAnswer(); }
  });
  later(REDUCED?60:beat*9.6,()=>{ if(RUN.live) step(); });
}

/* ------------------------------------------------------------ controls */
function generate(fly){
  const v=$('pin').value;
  stopTrace();
  if(fly) fitFrame('E',900);
  document.querySelectorAll('#rail button').forEach(x=>x.classList.toggle('on',fly&&x.dataset.stage==='E'));
  startRun(v);
}
$('run').onclick=()=>generate(true);
$('pin').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); generate(true); } });

/* ======================================================================
   The guided trace
   ====================================================================== */
const H_D1=hero('W',P_D1,C.data,3.0), H_D2=hero('B',P_D2,C.data,3.0),
      H_D3=hero('C',P_D3,C.data,2.0), H_D4=hero('D',P_D4,C.data,2.2), H_D4b=hero('D',P_D4b,C.data,1.1);
const TRACE=[
 {box:[60,240,760,320], t:()=>'You type “' + ($('pin').value.trim()||'Why is the sky blue?') + '” and press return. Your device encrypts it and drops a few kilobytes into the fibre, to travel some thousands of kilometres.', run:()=>H_D1.play()},
 {box:[60,490,1520,570], t:()=>'Meanwhile the grid is pushing perhaps twenty megawatts at the building. A gas plant, a wind farm and a solar field generate it; a step-up transformer raises it to 230 kV so the wires do not waste it on the way.'},
 {box:[60,1050,1520,310], t:()=>'Water is drawn from a river, screened, filtered, softened and dosed. Its only job is to absorb the heat those GPUs are about to make — and there is no cooling without it.'},
 {box:[1660,270,700,1060], t:()=>'At the fence: fibre terminates in the meet-me room, power passes the switchgear, the UPS and the transformers, and the coolant loop is handed from facility water to clean rack coolant.', run:()=>H_D2.play()},
 {box:[2280,260,1380,820], t:()=>'Spine switches read the destination. A load balancer picks a node with capacity to spare, and the packet goes down the overhead fibre tray to row B, cabinet fourteen.'},
 {box:[3720,60,780,1300], t:()=>'Rack B-14. The top-of-rack switch hands your request to GPU server 2. The strips down the sides feed it forty kilowatts; the manifold at the back pushes 25 °C coolant through every node.', run:()=>H_D3.play()},
 {box:[4580,60,1220,1300], t:()=>'Inside the server, NIC 6 writes your tokens straight into the memory of GPU 6 without troubling the CPU. Eight GPUs hold one model between them and agree over NVLink after every block.', run:()=>{H_D4.play(); later(2200,()=>H_D4b.play());}},
 {box:[5900,200,1600,760], t:()=>'Your text becomes tokens, the tokens become vectors. Eighty layers refine them: attention asks which earlier tokens matter, the MLP works out what that pattern means, and every layer is split eight ways.', run:()=>{ if(!RUN.live) startRun($('pin').value); }},
 {box:[5900,940,1600,400], t:()=>'The last vector is scored against the whole vocabulary, softmax turns the scores into probabilities, and one token is drawn. That single word-piece is the entire output of the pass.'},
 {box:[0,0,7560,1420], t:()=>'It races home the same way — GPU, card, switch, spine, fibre, your screen — and then the whole plate runs again for the next token, some thirty times a second.'},
];
let traceI=-1, traceT=null, tracePlay=true;
const cap2=$('caption');
function showStep(i){
  traceI=Math.max(0,Math.min(TRACE.length-1,i));
  const st=TRACE[traceI];
  userMoved=false; fit(st.box[0],st.box[1],st.box[2],st.box[3],.05,1100);
  cap2.querySelector('.step').textContent='Step '+(traceI+1)+' of '+TRACE.length;
  cap2.querySelector('p').textContent=st.t();
  cap2.querySelector('.dots').innerHTML=TRACE.map((_,k)=>'<i class="'+(k<=traceI?'on':'')+'"></i>').join('');
  cap2.hidden=false;
  $('capPrev').disabled=traceI===0;
  if(st.run) setTimeout(st.run,950);
  clearTimeout(traceT);
  if(tracePlay&&traceI<TRACE.length-1) traceT=setTimeout(()=>showStep(traceI+1),9500);
}
function startTrace(){
  pinned=null; info.hidden=true; hil.setAttribute('opacity',0);
  tracePlay=true; $('capPlay').textContent='Pause'; $('capPlay').setAttribute('aria-pressed','true');
  document.querySelectorAll('#rail button').forEach(x=>x.classList.remove('on'));
  showStep(0);
}
function stopTrace(){ clearTimeout(traceT); traceI=-1; cap2.hidden=true; }
$('trace').onclick=startTrace;
$('capPrev').onclick=()=>showStep(traceI-1);
$('capNext').onclick=()=>{ if(traceI>=TRACE.length-1) stopTrace(); else showStep(traceI+1); };
$('capPlay').onclick=()=>{ tracePlay=!tracePlay; $('capPlay').textContent=tracePlay?'Pause':'Play';
  $('capPlay').setAttribute('aria-pressed',String(tracePlay));
  clearTimeout(traceT); if(tracePlay&&traceI<TRACE.length-1) traceT=setTimeout(()=>showStep(traceI+1),3000); };
$('capStop').onclick=stopTrace;

/* ======================================================================
   Boot
   ====================================================================== */
if(REDUCED) document.documentElement.classList.add('rm');
fitFrame('all',0);
setTimeout(()=>fitFrame('all',0),60);
document.querySelector('#rail button').classList.add('on');
startRun($('pin').value);
</script>
