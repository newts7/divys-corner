<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A foundation of fundamentals with AI built on top">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <ellipse cx="600" cy="120" rx="520" ry="300" fill="url(#glow2)"/>

  <!-- upward progression arrow: base -> AI -->
  <g stroke="#0071e3" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="120" y1="470" x2="120" y2="150"/>
    <polyline points="100,178 120,148 140,178"/>
  </g>

  <!-- foundation stack: widest at the base, narrowing upward -->
  <g font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" text-anchor="middle">

    <!-- Layer 1: language (base, widest) -->
    <rect x="180" y="420" width="840" height="70" rx="12" fill="#1d1d1f"/>
    <text x="600" y="464" font-size="24" font-weight="600" fill="#ffffff">Learn one language — start with Python</text>

    <!-- Layer 2: OOP / SOLID -->
    <rect x="260" y="332" width="680" height="66" rx="12" fill="#1d1d1f" opacity="0.82"/>
    <text x="600" y="373" font-size="22" font-weight="600" fill="#ffffff">OOP patterns &amp; SOLID principles</text>

    <!-- Layer 3: databases -->
    <rect x="340" y="248" width="520" height="62" rx="12" fill="#1d1d1f" opacity="0.64"/>
    <text x="600" y="287" font-size="21" font-weight="600" fill="#ffffff">Basics of databases</text>

    <!-- Layer 4: write code yourself -->
    <rect x="410" y="168" width="380" height="58" rx="12" fill="#1d1d1f" opacity="0.46"/>
    <text x="600" y="204" font-size="19" font-weight="600" fill="#ffffff">Write code yourself</text>

    <!-- Top: AI (the payoff) -->
    <rect x="470" y="92" width="260" height="54" rx="27" fill="#0071e3"/>
    <text x="600" y="126" font-size="20" font-weight="600" fill="#ffffff">Then: AI, full force</text>
  </g>

  <!-- title strip -->
  <g font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="552" font-size="30" font-weight="600" fill="#1d1d1f">Don't skip the boring part</text>
    <text x="600" y="586" font-size="17" fill="#86868b">Fundamentals first — then let AI fly</text>
  </g>
</svg>
