<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Writing code has moved to the machine, while solving the problem stays with the programmer and gets amplified">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="120" rx="520" ry="300" fill="url(#glow)"/>

  <g font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- left: the coder -->
    <text x="330" y="150" font-size="22" font-weight="700" fill="#86868b">THE CODER</text>
    <rect x="150" y="190" width="360" height="90" rx="12" fill="#1d1d1f" opacity="0.46"/>
    <text x="330" y="245" font-size="24" font-weight="600" fill="#ffffff">Writing syntax</text>
    <line x1="170" y1="235" x2="490" y2="235" stroke="#1d1d1f" stroke-width="6" stroke-linecap="round"/>
    <text x="330" y="330" font-size="19" fill="#86868b">handed to the machine</text>

    <!-- arrow -->
    <line x1="545" y1="235" x2="645" y2="235" stroke="#86868b" stroke-width="6" stroke-linecap="round"/>
    <polyline points="625,215 650,235 625,255" fill="none" stroke="#86868b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- right: the programmer -->
    <text x="870" y="150" font-size="22" font-weight="700" fill="#0071e3">THE PROGRAMMER</text>
    <rect x="690" y="190" width="360" height="90" rx="12" fill="#0071e3"/>
    <text x="870" y="245" font-size="24" font-weight="600" fill="#ffffff">Solving the problem</text>
    <text x="870" y="330" font-size="19" fill="#1d1d1f">now with a thousand hands</text>

    <circle cx="780" cy="400" r="12" fill="#0071e3"/>
    <circle cx="830" cy="400" r="12" fill="#0071e3" opacity="0.82"/>
    <circle cx="880" cy="400" r="12" fill="#0071e3" opacity="0.64"/>
    <circle cx="930" cy="400" r="12" fill="#0071e3" opacity="0.46"/>
    <circle cx="980" cy="400" r="12" fill="#0071e3" opacity="0.3"/>
  </g>

  <g font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="552" font-size="30" font-weight="600" fill="#1d1d1f">Coding is dead. Programming is on steroids.</text>
    <text x="600" y="586" font-size="17" fill="#86868b">The code was always the receipt. The problem was the job.</text>
  </g>
</svg>
